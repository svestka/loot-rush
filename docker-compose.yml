# Local dev/test only — runs PostgreSQL for the app to connect to.
# Usage: docker compose up -d && npm start

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loot
      POSTGRES_PASSWORD: loot
      POSTGRES_DB: loot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
