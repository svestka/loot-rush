name: LootRush CI/CD

on:
  push:
    branches: [main, fixed]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loot
          POSTGRES_PASSWORD: loot
          POSTGRES_DB: loot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://loot:loot@localhost:5432/loot
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgres://loot:loot@localhost:5432/loot

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (placeholder)
        run: echo "Deploying LootRush to production"
